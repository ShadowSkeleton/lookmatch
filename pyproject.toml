[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lookmatch"
dynamic = ["version"]
description = "Match the color look of a reference photo and apply it to your photos."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jackson Feng" }]
requires-python = ">=3.11"
keywords = ["color grading", "lut", "photography", "color matching", "lightroom"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "colour-science",
    "POT",
    "rawpy",
    "pillow",
    "typer",
    "jinja2",
    "matplotlib",
]

[project.optional-dependencies]
mcp = ["mcp"]
vision = ["opencv-python", "mediapipe"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
lookmatch = "lookmatch.cli:app"

[project.urls]
Repository = "https://github.com/ShadowSkeleton/lookmatch"

[tool.setuptools.dynamic]
version = { attr = "lookmatch.__version__" }

[tool.setuptools.packages.find]
include = ["lookmatch*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lookmatch"]

[[tool.mypy.overrides]]
# rawpy's __init__ imports its names from rawpy._rawpy without re-exporting them.
module = ["rawpy"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
